<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title description">
  <title id="title">ESP32 trigger and laser-module wiring</title>
  <desc id="description">Two wiring diagrams. The first connects a trigger switch from ESP32 GPIO 33 to 3.3 volts, with an optional 10 kiloohm pull-down to ground. The second uses GPIO 23 through a 100 ohm resistor to drive an AO3400A N-channel MOSFET that switches a laser module's ground connection.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #15202b; }
    .heading { font-size: 30px; font-weight: bold; }
    .label { font-size: 20px; font-weight: bold; }
    .note { font-size: 17px; }
    .small { font-size: 15px; }
    .wire { fill: none; stroke: #1d5e91; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .ground { fill: none; stroke: #15202b; stroke-width: 3; }
    .component { fill: #fff; stroke: #15202b; stroke-width: 3; }
    .optional { fill: #f7f7f7; stroke: #6a737d; stroke-width: 3; stroke-dasharray: 9 7; }
    .chip { fill: #e7f3ff; stroke: #1d5e91; stroke-width: 3; }
    .supply { fill: #eaf7ed; stroke: #26734d; stroke-width: 3; }
    .warning { fill: #fff4e5; stroke: #ad6800; stroke-width: 2; }
  </style>

  <rect width="1200" height="920" fill="#ffffff"/>
  <text x="60" y="58" class="heading">ESP32 trigger and laser-module wiring</text>

  <rect x="45" y="90" width="1110" height="340" rx="14" fill="#f8fbfd" stroke="#c9d8e5" stroke-width="2"/>
  <text x="75" y="132" class="heading">1. Trigger input: active high</text>
  <rect x="85" y="175" width="230" height="185" rx="10" class="chip"/>
  <text x="122" y="215" class="label">ESP32</text>
  <text x="110" y="265" class="label">3V3</text>
  <text x="110" y="315" class="label">GPIO 33</text>
  <text x="110" y="352" class="label">GND</text>

  <path d="M315 260 H470" class="wire"/>
  <path d="M315 310 H470 V260" class="wire"/>
  <circle cx="470" cy="260" r="7" fill="#1d5e91"/>
  <path d="M470 260 H565" class="wire"/>
  <path d="M565 242 L625 278" class="ground"/>
  <path d="M635 260 H770" class="wire"/>
  <text x="550" y="220" class="label">Trigger switch</text>
  <text x="600" y="303" class="small">closes when fired</text>
  <text x="418" y="247" class="small">3.3 V</text>

  <path d="M470 260 V335" class="wire"/>
  <rect x="440" y="335" width="60" height="48" class="optional"/>
  <text x="370" y="405" class="small">optional 10 kOhm</text>
  <path d="M470 383 V400" class="wire"/>
  <path d="M445 400 H495 M452 410 H488 M460 420 H480" class="ground"/>
  <text x="790" y="265" class="note">Idle: GPIO 33 is LOW via the internal pull-down.</text>
  <text x="790" y="297" class="note">Press: switch drives GPIO 33 HIGH and wakes the ESP32.</text>
  <text x="790" y="329" class="note">Use the optional resistor for long or noisy switch wiring.</text>
  <rect x="790" y="350" width="300" height="48" rx="8" class="warning"/>
  <text x="808" y="380" class="note">Never apply 5 V to GPIO 33.</text>

  <rect x="45" y="470" width="1110" height="400" rx="14" fill="#f8fbfd" stroke="#c9d8e5" stroke-width="2"/>
  <text x="75" y="512" class="heading">2. Laser module: MOSFET low-side switch</text>
  <rect x="85" y="560" width="230" height="175" rx="10" class="chip"/>
  <text x="122" y="600" class="label">ESP32</text>
  <text x="110" y="650" class="label">GPIO 23</text>
  <text x="110" y="705" class="label">GND</text>

  <rect x="790" y="545" width="250" height="110" rx="10" class="supply"/>
  <text x="820" y="585" class="label">Laser module</text>
  <text x="820" y="618" class="note">with built-in current driver</text>
  <text x="810" y="646" class="small">+LASER                      -LASER</text>

  <path d="M315 645 H395" class="wire"/>
  <rect x="395" y="620" width="105" height="50" class="component"/>
  <text x="408" y="651" class="small">100 Ohm</text>
  <path d="M500 645 H625" class="wire"/>
  <circle cx="625" cy="645" r="7" fill="#1d5e91"/>
  <path d="M625 645 V755" class="wire"/>
  <rect x="595" y="680" width="60" height="54" class="component"/>
  <text x="535" y="765" class="small">100 kOhm</text>
  <path d="M625 734 V755" class="wire"/>
  <path d="M600 755 H650 M607 765 H643 M615 775 H635" class="ground"/>

  <rect x="650" y="670" width="130" height="100" rx="8" class="component"/>
  <text x="676" y="710" class="label">AO3400A</text>
  <text x="684" y="742" class="small">N-MOSFET</text>
  <text x="636" y="660" class="small">G</text>
  <text x="784" y="697" class="small">D</text>
  <text x="784" y="755" class="small">S</text>
  <path d="M625 645 H650" class="wire"/>
  <path d="M780 695 H900 V655" class="wire"/>
  <path d="M780 750 V790 H1060" class="wire"/>
  <path d="M1040 655 H1080 V790 H1060" class="wire"/>
  <path d="M315 700 H360 V790 H1060" class="wire"/>
  <circle cx="1060" cy="790" r="7" fill="#1d5e91"/>
  <text x="840" y="815" class="note">Common ground: ESP32, laser supply, and MOSFET source</text>

  <path d="M900 545 V520 H1040 V545" class="wire"/>
  <rect x="948" y="505" width="44" height="32" class="component"/>
  <text x="900" y="495" class="small">100 nF near module</text>
  <text x="800" y="710" class="small">laser module negative</text>
  <text x="1045" y="595" class="small">laser supply positive</text>
</svg>
